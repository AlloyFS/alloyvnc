[workspace]
resolver = "2"
members = [
    "crates/alloyvnc-proto",
    "crates/alloyvnc-region",
    "crates/alloyvnc-encode",
    "crates/alloyvnc-screen",
    "crates/alloyvnc",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlloyFS/alloyvnc"

# The lints CI enforces, declared where the editor can see them. CI runs
# `clippy --workspace --all-targets -- -D warnings`; rust-analyzer reads only
# the manifest, so without this table a lint the gate rejects looks clean in
# the editor until push time.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# The capture backends are FFI. An unsafe fn does not get to make its whole
# body an implicit unsafe block: every unsafe operation names itself, which
# is what makes a safety comment reviewable.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
alloyvnc-proto = { path = "crates/alloyvnc-proto" }
alloyvnc-region = { path = "crates/alloyvnc-region" }
alloyvnc-encode = { path = "crates/alloyvnc-encode" }
alloyvnc-screen = { path = "crates/alloyvnc-screen" }

anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
des = "0.8"
parking_lot = "0.12"
rand = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Line tables only: panics and backtraces keep their file:line, and the
# target directory stays a fraction of the size full DWARF makes it.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
